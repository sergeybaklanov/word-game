<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Matching Game</title>
    <script src="Vocabulary.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div id="theme-selection" class="game-screen">
            <h2>Select a Vocabulary Theme</h2>
            <select id="selectionMenu">
            </select>
            <input id="submitWords" type="submit">
        </div>
        <h1>Find Translation</h1>
        <label class="switch">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider"></span>
        </label>
        <div class="columns">
            <div class="column left">
                <ul id="englishWords">
                    <!-- English words will be dynamically loaded here -->
                </ul>
            </div>
            <div class="column right">
                <ul id="translatedWords">
                    <!-- Translations will be dynamically loaded here -->
                </ul>
            </div>
        </div>
        <div id="status"></div>
    </div>

    
</body>
</html>
