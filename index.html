<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordUp — вивчення слів і граматики</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <span class="brand-emoji" aria-hidden="true">📚</span>
                <span class="brand-name">WordUp</span>
            </div>
            <div class="header-actions">
                <div class="streak-badge" title="Серія днів практики">
                    <span aria-hidden="true">🔥</span>
                    <span id="streakCount">0</span>
                </div>
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Перемкнути тему">🌙</button>
            </div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab active" data-tab="practice" type="button">Практика</button>
            <button class="tab" data-tab="grammar" type="button">Граматика</button>
            <button class="tab" data-tab="progress" type="button">Прогрес</button>
        </nav>

        <main>
            <section class="view" id="view-practice">
                <div class="practice-controls">
                    <div class="category-select" id="categorySelect"></div>
                    <div class="mode-toggle" role="group" aria-label="Режим гри">
                        <button class="mode-btn active" data-mode="translation" type="button">Переклад</button>
                        <button class="mode-btn" data-mode="sentence" type="button">Речення</button>
                    </div>
                </div>

                <div class="session-bar">
                    <div class="session-stat">
                        <span class="session-stat-value" id="wordsInTheList">0</span>
                        <span class="session-stat-label">у списку</span>
                    </div>
                    <div class="session-stat">
                        <span class="session-stat-value" id="wordsLeft">0</span>
                        <span class="session-stat-label">на повторення</span>
                    </div>
                    <div class="session-stat">
                        <span class="session-stat-value" id="sessionStreak">0</span>
                        <span class="session-stat-label">серія влучних</span>
                    </div>
                </div>

                <div class="columns">
                    <div class="column left">
                        <ul id="englishWords"></ul>
                    </div>
                    <div class="column right">
                        <ul id="translatedWords"></ul>
                    </div>
                </div>

                <div id="status" class="status"></div>
            </section>

            <section class="view hidden" id="view-grammar">
                <div class="grammar-list" id="grammarList"></div>
            </section>

            <section class="view hidden" id="view-progress">
                <div class="progress-list" id="progressList"></div>
            </section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
