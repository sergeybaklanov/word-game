<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Matching Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="game-container">
        <h1>Find Translation</h1>
        <div class="dropdown">
            <button class="dropbtn">Dropdown</button>
            <div class="dropdown-content" id="dropdownContent">
            </div>
        </div>
        <div>
            <label class="switch">
                <input type="checkbox" id="toggleSwitch"> 
                <span class="slider"></span>
            </label> 
            <span>
                Sentence Mode.
            </span>
        </div>
        <div id='wordsInTheList'></div>
        <div id='wordsLeft'></div>
        <div class="columns">
            <div class="column left">
                <ul id="englishWords">
                    <!-- English words will be dynamically loaded here -->
                </ul>
            </div>
            <div class="column right">
                <ul id="translatedWords">
                    <!-- Translations will be dynamically loaded here -->
                </ul>
            </div>
        </div>
        <div id="status"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
